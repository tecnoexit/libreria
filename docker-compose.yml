services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - libreria_database:/var/www/html/database
      - libreria_uploads:/var/www/html/storage/app/public

volumes:
  libreria_database:
  libreria_uploads:
